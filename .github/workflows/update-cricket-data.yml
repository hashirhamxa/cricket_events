name: Update Cricket Fixtures & Metadata

on:
  schedule:
    - cron: "0 */4 * * *"  # Run every 4 hours
  workflow_dispatch:        # Allow manual triggering

concurrency:
  group: cricket-data-update
  cancel-in-progress: true

# Grant write permissions so the GitHub Actions bot can push commits
permissions:
  contents: write

jobs:
  update-cricket-data:
    name: Fetch, Normalize & Publish Cricket Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Execute Cricket Data Pipeline
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_pipeline.py

      - name: Validate Generated Production Datasets
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate.py

      - name: Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Stage data and assets
          git add data/ images/ raw/
          
          # Check if changes exist
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: update cricket fixtures ${TIMESTAMP} [skip ci]"
            
            # Fetch latest remote changes and push to current branch (default: master)
            BRANCH_NAME="${GITHUB_REF_NAME:-master}"
            git pull --rebase origin "$BRANCH_NAME" || true
            git push origin HEAD:"$BRANCH_NAME"
          fi
