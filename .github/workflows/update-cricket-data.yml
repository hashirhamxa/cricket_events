name: Update Cricket Fixtures & Metadata

on:
  schedule:
    - cron: "0 */4 * * *"  # Run every 4 hours
  workflow_dispatch:        # Allow manual triggering

concurrency:
  group: cricket-data-update
  cancel-in-progress: true

jobs:
  update-cricket-data:
    name: Fetch, Normalize & Publish Cricket Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Execute Cricket Data Pipeline
        run: |
          python scripts/run_pipeline.py

      - name: Validate Generated Production Datasets
        run: |
          python scripts/validate.py

      - name: Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage data and assets
          git add data/ images/ raw/
          
          # Check if changes exist
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: update cricket fixtures ${TIMESTAMP} [skip ci]"
            git push
          fi
